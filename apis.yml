name: Mainspring Energy
description: Mainspring Energy is a Menlo Park, California power-infrastructure company that designs,
  manufactures, and deploys the Linear Generator, a modular, fuel-flexible onsite power generation system.
  Its technology delivers firm, dispatchable, and low-emission electricity for data centers, utilities,
  and industrial and enterprise facilities, running today on natural gas and biogas with a seamless transition
  to zero-carbon fuels such as hydrogen and ammonia. Backed by Khosla Ventures and other investors, Mainspring
  has more than one gigawatt of Linear Generator capacity in late-stage development and operation. Mainspring
  is a hardware and power-systems company and does not currently publish a public developer API, SDK,
  or developer portal; this profile captures its corporate, security, and compliance surface.
